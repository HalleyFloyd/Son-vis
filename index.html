<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Zombie Survival 2D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="mobileControls">
    <div id="joystickZone" class="touch-zone"></div>
  </div>

  <div id="mainMenu" class="screen">
    <h1>ZOMBIE SURVIVAL 2D</h1>
    <button class="btn" onclick="showScreen('heroMenu')">JUGAR</button>
    <button class="btn" onclick="showScreen('codexMenu')">CÓDICE DE AUMENTOS</button>
  </div>

  <div id="heroMenu" class="screen hidden">
    <h1>ELIGE TU PERSONAJE</h1>
    <div id="heroGrid" class="selection-grid"></div>
    <div style="margin-top: 15px;">
      <button class="btn" onclick="showScreen('weaponMenu')">CONTINUAR</button>
      <button class="btn" style="background: #444;" onclick="showScreen('mainMenu')">VOLVER</button>
    </div>
  </div>

  <div id="weaponMenu" class="screen hidden">
    <h1>ELIGE TU ARMA</h1>
    <div id="weaponGrid" class="selection-grid"></div>
    <div style="margin-top: 15px;">
      <button class="btn" onclick="startGame()">EMPEZAR</button>
      <button class="btn" style="background: #444;" onclick="showScreen('heroMenu')">VOLVER</button>
    </div>
  </div>

  <div id="codexMenu" class="screen hidden">
    <h1>CÓDICE DE AUMENTOS (90 ÚNICOS)</h1>
    <div id="codexList" class="codex-list"></div>
    <button class="btn" style="margin-top: 15px;" onclick="showScreen('mainMenu')">VOLVER</button>
  </div>

  <div id="levelUpMenu" class="screen hidden">
    <h1 style="color: #00ffcc;">¡NIVEL ALCANZADO!</h1>
    <p style="margin-bottom: 12px; color: #aaa;">Elige una mejora única:</p>
    <div id="augmentsContainer" class="augments-container"></div>
  </div>

  <div id="pauseMenu" class="screen hidden">
    <h1>PAUSA</h1>
    <div id="pausedAugmentsList" style="max-height: 55vh; overflow-y:auto; margin-bottom:15px; text-align:left; width:90%; max-width:550px; background:#111; padding:15px; border-radius:8px; border:1px solid #333;"></div>
    <button class="btn" onclick="togglePause()">REANUDAR</button>
    <button class="btn" style="background: #444;" onclick="quitToMain()">MENÚ PRINCIPAL</button>
  </div>

  <div id="gameOverMenu" class="screen hidden">
    <h1 style="color: #ff3333; font-size: 3rem;">¡HAS MUERTO!</h1>
    <p id="gameOverStats" style="margin-bottom: 20px; font-size: 1.2rem; color: #ccc; text-align: center;"></p>
    <button class="btn" onclick="startGame()">JUGAR DE NUEVO</button>
    <button class="btn" style="background: #444;" onclick="quitToMain()">MENÚ PRINCIPAL</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
